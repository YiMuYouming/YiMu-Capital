<script>
'use strict';

// === GridStack Init ===
var grid = null;
var activePreset = null;

function initGrid() {
  grid = GridStack.init({
    column: 12,
    cellHeight: 60,
    margin: 6,
    float: true,
    animate: false,
    handle: '.widget-header',
    removable: true,
    removeTimeout: 100,
    acceptWidgets: true,
    dragIn: '.newWidget',
    dragInOptions: { revert: 'invalid', scroll: false, appendTo: 'body', helper: 'clone' },
    disableOneColumnMode: true,
    minRow: 1,
    maxRow: 100,
  });

  // 事件监听
  grid.on('dragstart', function() { isDragging = true; });
  grid.on('dragstop', function() { isDragging = false; DataStore.notifyAll(); });
  grid.on('resizestop', function(e, el) { _onWidgetResize(el); });
  grid.on('change', function() { _autoSaveLayout(); });

  // 从 localStorage 恢复布局
  _loadSavedLayout();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('topbar').style.display = '';
  document.body.classList.add('ready');
}

// === Widget 实例管理 ===
var widgetInstances = {};

function _addWidgetToGrid(widgetId) {
  // W16 报数面板：浮窗模式，不加入 GridStack
  if (widgetId === 'W16') { _showInputPanel(); return; }

  // 去重：已有同 ID 组件则聚焦并提示
  if (widgetInstances[widgetId]) {
    var exist = document.querySelector('[gs-id="' + widgetId + '"]');
    if (exist) exist.scrollIntoView({ behavior: 'smooth' });
    showToast((WidgetRegistry.getMeta(widgetId)||{}).title + ' 已在画布中');
    return;
  }

  var meta = WidgetRegistry.getMeta(widgetId);
  if (!meta) return;

  var entry = WidgetRegistry.get(widgetId);
  if (!entry || !entry.Class) {
    console.warn('Widget ' + widgetId + ' not registered yet. Loading placeholder.');
    _addPlaceholderWidget(widgetId, meta);
    return;
  }

  var instance = new entry.Class({
    id: meta.id,
    type: meta.type,
    title: meta.title,
    category: meta.category,
    tier: meta.tier,
    dataPaths: meta.dataPaths,
    defaultSize: meta.defaultSize,
  });

  // GridStack v12 标准：addWidget 返回 HTMLElement，直接取 grid-stack-item-content 挂载
  var gsItem = grid.addWidget({ w: meta.defaultSize.w, h: meta.defaultSize.h, id: widgetId });
  var contentEl = gsItem.querySelector('.grid-stack-item-content');
  if (contentEl) contentEl.id = 'content_' + widgetId;
  widgetInstances[widgetId] = instance;
  requestAnimationFrame(function() {
    var contentEl = document.getElementById('content_' + widgetId);
    if (contentEl) instance.mount(contentEl);
  });
}

function _addPlaceholderWidget(widgetId, meta) {
  var headerCls = meta.category==='decision'?'color-decision':meta.category==='data'?'color-data':meta.category==='risk'?'color-risk':'color-tool';
  grid.addWidget({
    w: meta.defaultSize.w, h: meta.defaultSize.h, id: widgetId,
    content: '<div id="content_' + widgetId + '">' +
      '<div class="widget-header ' + headerCls + '" style="cursor:default"><span class="widget-title">' + meta.title + '</span></div>' +
      '<div class="widget-body" style="display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">组件加载中...</div></div>'
  });
}

function _removeWidget(widgetId) {
  var instance = widgetInstances[widgetId];
  if (instance) { instance.unmount(); delete widgetInstances[widgetId]; }
  var el = document.querySelector('[gs-id="' + widgetId + '"]');
  if (el) {
    grid.removeWidget(el, true, false);
    // 5 秒撤销 toast
    var removedMeta = WidgetRegistry.getMeta(widgetId);
    showToast('已删除 ' + (removedMeta?removedMeta.title:widgetId) + '（5秒内可撤销）');
    window._undoRemove = { widgetId: widgetId, meta: removedMeta, timer: setTimeout(function() { window._undoRemove = null; }, 5000) };
  }
}

function _undoRemoveWidget() {
  if (!window._undoRemove) return;
  var item = window._undoRemove;
  clearTimeout(item.timer);
  window._undoRemove = null;
  _addWidgetToGrid(item.widgetId);
  showToast('已恢复 ' + item.meta.title);
}
// 暴露给 widget-base.js
window._removeWidget = _removeWidget;

function _onWidgetResize(el) {
  var id = el.getAttribute('gs-id');
  var instance = widgetInstances[id];
  if (instance && el.gridstackNode) {
    instance.resize(el.gridstackNode.w, el.gridstackNode.h);
  }
}

// === Context Menu ===
function _showContextMenu(x, y) {
  var menu = document.getElementById('contextMenu');
  var cats = WidgetRegistry.listByCategory();
  var catLabels = { decision: '决策类', data: '数据类', risk: '风控类', tool: '工具类' };

  var html = '';
  ['decision', 'risk', 'data', 'tool'].forEach(function(cat) {
    html += '<div class="context-menu-section">' + catLabels[cat] + '</div>';
    (cats[cat] || []).forEach(function(w) {
      html += '<div class="context-menu-item" data-widget="' + w.id + '">' + w.title + '</div>';
    });
  });

  menu.innerHTML = html;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('show');

  menu.querySelectorAll('.context-menu-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var wid = item.dataset.widget;
      _addWidgetToGrid(wid);
      menu.classList.remove('show');
    });
  });
}

document.addEventListener('click', function(e) {
  var menu = document.getElementById('contextMenu');
  if (!menu.contains(e.target)) menu.classList.remove('show');
});

// === Widget Panel (v2.1.1: 组件选择面板) ===
function _showWidgetPanel() {
  var overlay = document.getElementById('widgetPanelOverlay');
  var body = document.getElementById('widgetPanelBody');
  var cats = WidgetRegistry.listByCategory();
  var catLabels = { decision: '决策类', data: '数据类', risk: '风控类', tool: '工具类' };
  var catIcons = { decision: '🎯', data: '📊', risk: '💰', tool: '🔧' };

  var html = '';
  ['decision', 'risk', 'data', 'tool'].forEach(function(cat) {
    html += '<div class="widget-panel-section">';
    html += '<div class="widget-panel-section-title">' + (catIcons[cat]||'') + ' ' + catLabels[cat] + '</div>';
    html += '<div class="widget-panel-grid">';
    (cats[cat] || []).forEach(function(w) {
      html += '<div class="widget-panel-item" data-widget="' + w.id + '">' +
        '<div class="item-title">' + w.title + '</div>' +
        '<div class="item-desc">' + w.defaultSize.w + '×' + w.defaultSize.h + ' · ' + w.id + '</div>' +
        '</div>';
    });
    html += '</div></div>';
  });

  body.innerHTML = html;
  overlay.classList.add('show');

  // 点击添加
  body.querySelectorAll('.widget-panel-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var wid = item.dataset.widget;
      _addWidgetToGrid(wid);
      overlay.classList.remove('show');
      showToast('已添加: ' + (WidgetRegistry.getMeta(wid)||{}).title);
    });
  });
}

document.getElementById('widgetPanelOverlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('widgetPanelClose').addEventListener('click', function() {
  document.getElementById('widgetPanelOverlay').classList.remove('show');
});

// 顶栏按钮
document.getElementById('addWidgetBtn').addEventListener('click', _showWidgetPanel);
document.getElementById('inputPanelBtn').addEventListener('click', _showInputPanel);
document.getElementById('llmPanelBtn').addEventListener('click', function() {
  if (window._llmChat) window._llmChat.show();
  else _showLLMPanel();  // fallback
});
document.getElementById('pnlCurveBtn').addEventListener('click', function() { _addWidgetToGrid('W22'); });

// === W20 AI盯盘浮窗（红点+Toast）===
var _llmLoading = false;
var _llmBadgeCount = 0;

function _updateLlmBadge() {
  var badge = document.getElementById('llmBadge');
  if (!badge) return;
  if (_llmBadgeCount > 0) {
    badge.textContent = _llmBadgeCount > 9 ? '9+' : _llmBadgeCount;
    badge.style.display = '';
  } else {
    badge.style.display = 'none';
  }
}

function _notifyLLMAuto(text) {
  var summary = (text || '').substring(0, 80);
  showToast('🤖 AI研判: ' + summary + (summary.length >= 80 ? '...' : ''));
  // 红点（聊天框未聚焦时计数）
  var panelBody = document.getElementById('chatMessages');
  if (!panelBody || !panelBody.contains(document.activeElement)) {
    _llmBadgeCount++;
  }
  _updateLlmBadge();
}

function _showLLMPanel() {
  document.getElementById('llmPanelOverlay').classList.add('show');
  _llmBadgeCount = 0;   // 打开即清红点
  _updateLlmBadge();
  _refreshLLMPanel();
}
function _refreshLLMPanel() {
  if (_llmLoading) return;
  var body = document.getElementById('llmPanelBody');
  _llmLoading = true;
  body.innerHTML = '<div style="text-align:center;padding:var(--sp-lg);color:var(--text-secondary)">⏳ 加载研判数据...</div>';

  // 加载 llm_insights.json
  fetch('data/llm_insights.json?t=' + Date.now())
    .then(function(r) { return r.ok ? r.json() : {}; })
    .catch(function() { return {}; })
    .then(function(insights) {
      var today = new Date().toISOString().slice(0,10);
      var todayItems = insights[today] || {};
      var nodes = ['竞价','早盘','午盘','尾盘','收盘'];
      var entries = [];
      Object.keys(todayItems).forEach(function(k) {
        entries.push({node: k, ts: todayItems[k].timestamp, text: todayItems[k].text});
      });
      entries.sort(function(a,b) { return (a.ts||'').localeCompare(b.ts||''); });

      var html = '';
      if (entries.length === 0) {
        html += '<div style="text-align:center;padding:var(--sp-lg);color:var(--text-disabled)">今日暂无研判<br><span style="font-size:var(--fs-label)">盘中每15分钟自动触发，或点🔄手动触发</span></div>';
      } else {
        entries.forEach(function(e) {
          html += '<div style="margin-bottom:var(--sp-md);padding:var(--sp-sm) var(--sp-md);background:var(--bg-base);border-radius:var(--radius-md);border-left:3px solid var(--info)">'+
            '<div style="display:flex;align-items:center;gap:var(--sp-sm);margin-bottom:var(--sp-xs)">'+
              '<span style="font-weight:700;font-size:14px;color:var(--info)">'+e.node+'</span>'+
              '<span style="font-size:var(--fs-label);color:var(--text-disabled)">'+e.ts+'</span>'+
            '</div>'+
            '<div style="font-size:14px;line-height:1.8">'+(e.text||'').replace(/\n/g,'<br>')+'</div>'+
            '</div>';
        });
      }
      _llmLoading = false;
      body.innerHTML = html;
    });
}
function _triggerLLMFromPanel() {
  if (_llmLoading) return;
  var body = document.getElementById('llmPanelBody');
  _llmLoading = true;
  body.innerHTML = '<div style="text-align:center;padding:var(--sp-lg);color:var(--warn)">⏳ AI 正在分析全盘数据...</div>';

  fetch('/api/llm', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({mode: 'manual'})
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    _llmLoading = false;
    if (res.ok) {
      showToast('研判已完成');
      _refreshLLMPanel();
    } else {
      showToast('研判失败: ' + (res.error || '未知错误'));
      _refreshLLMPanel();
    }
  })
  .catch(function() {
    _llmLoading = false;
    showToast('网络错误，请重试');
    _refreshLLMPanel();
  });
}

    {name:'连板生态',open:false,ids:['风险值','最高板','次高板','梯队']},

    var ta2 = parseFloat(pnlLive.total_asset) || 0;

    html += '<div style="margin-bottom:var(--sp-sm);padding:8px 10px;background:var(--bg-base);border-radius:var(--radius-sm);display:flex;justify-content:space-between;font-size:var(--fs-body);gap:var(--sp-md)">' +
      '<span><span style="color:var(--text-disabled)">总资产</span> <span style="font-family:var(--font-mono);font-weight:700">' + ta2.toLocaleString() + '</span></span>' +
      '<span><span style="color:var(--text-disabled)">累计入金</span> <span style="font-family:var(--font-mono);font-weight:700">' + dp.toLocaleString() + '</span></span>' +
      '<span><span style="color:var(--text-disabled)">累计收益</span> <span style="font-family:var(--font-mono);font-weight:700;color:'+rc+'">'+(ret2>=0?'+':'')+ret2.toFixed(2)+'%</span></span>' +

    '<span style="font-size:var(--fs-label);color:var(--text-secondary)" id="inputLastUpdate"></span>' +

    var ts = document.getElementById('inputLastUpdate');
    if (ts) ts.textContent = '✓ 已更新 ' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    showToast('报数已刷新');

  // 输入即同步到 manualData
  allFields.forEach(function(f) {
    var el = body.querySelector('#in_' + f.id);

// === Presets (v2.0: 内联嵌入，避免 file:// CORS) ===
// === Layout Persistence ===
function _autoSaveLayout() {
  try {
    var layout = grid.save(false);
    localStorage.setItem(STORAGE_KEYS.layout, JSON.stringify({v:'2.1', items:layout}));
  } catch(e) {}
}
function _loadSavedLayout() {
  // v2.1: 只加载 v2.1 格式布局 {v:'2.1', items:[...]}
  try {
    var saved = localStorage.getItem(STORAGE_KEYS.layout);
    if (saved) {
      var data = JSON.parse(saved);
      if (data.v === '2.1' && Array.isArray(data.items) && data.items.length) {
        data.items.forEach(function(item) {
          var id = item.id;
          var meta = WidgetRegistry.getMeta(id);
          if (!meta) return;
          var entry = WidgetRegistry.get(id);
          var gsItem = grid.addWidget({
            x: item.x||0, y: item.y||0,
            w: item.w||meta.defaultSize.w, h: item.h||meta.defaultSize.h,
            id: id
          });
          var contentEl = gsItem.querySelector('.grid-stack-item-content');
          if (contentEl) contentEl.id = 'content_' + id;
          if (entry && entry.Class) {
            var instance = new entry.Class({
              id: meta.id, type: meta.type, title: meta.title,
              category: meta.category, tier: meta.tier,
              dataPaths: meta.dataPaths, defaultSize: meta.defaultSize,
            });
            widgetInstances[id] = instance;
            instance.mount(document.getElementById('content_' + id));
          }
        });
        return;
      }
    }
  } catch(e) {}
  // 旧格式或不兼容 → 清除，空白画布
  try { localStorage.removeItem(STORAGE_KEYS.layout); } catch(e) {}
  showToast('右键画布添加组件，拖拽摆放后 Ctrl+S 保存');
}
function exportLayout() {
  var layout = grid.save(false);
  var json = JSON.stringify({ version: '1.0', exported: new Date().toISOString(), widgets: layout }, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dashboard-layout-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('布局已导出');
}

function importLayout(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      (data.widgets || data || []).forEach(function(item) {
        var id = item.id; if (!id) return;
        if (!widgetInstances[id]) _addWidgetToGrid(id);
      });
      showToast('布局已导入');
    } catch(err) { showToast('导入失败：格式错误'); }
  };
  reader.readAsText(file);
}

// === Keyboard Shortcuts ===
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    Object.values(widgetInstances).forEach(function(inst) { inst.refresh(); });
    showToast('已刷新');
  }
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    var w16 = document.getElementById('content_W16');
    if (w16) w16.scrollIntoView({ behavior: 'smooth' });
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); _autoSaveLayout(); showToast('已保存'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); _undoRemoveWidget(); }
  if (e.key === 'a' || e.key === 'A') {
    e.preventDefault();
    var rect = document.body.getBoundingClientRect();
    _showContextMenu(rect.left + 100, rect.top + 100);
  }
});

});

// === Toast ===
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function() { t.className = 'toast'; }, 2500);
}

// === Init ===
// Wait for GridStack CDN
function waitForGridStack() {
  if (typeof GridStack !== 'undefined') {
    // 加载 manualData
    DataStore.manualData.load();
    // 立即用兜底数据初始化，避免白屏
    DataStore.init();
    // 初始化组件注册（widget 脚本已加载时自动注册见各 widget 文件末尾）
    initGrid();
    // LlmChatWidget（浮动聊天框，独立于 GridStack）
    if (window.LlmChatWidget) {
      var chatEl = document.getElementById('llmChatMount');
      window._llmChat = new LlmChatWidget({ id: 'LLM_CHAT' });
      window._llmChat.mount(chatEl);
    }
    // 尝试拉取基线数据（file:// 协议下会失败，降级到兜底数据）
    DataStore.fetchAll();
    // v2.0 PyTDX 实时管线：每个 tick 组件自带 5s 定时器刷新
  } else {
    setTimeout(waitForGridStack, 100);
  }
}

// === 组件搜索定位 ===
(function() {
  var input = document.getElementById('widgetSearch');
  if (!input) return;

  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      var active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
      e.preventDefault();
      input.focus();
      input.select();
    }
  });

  input.addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    document.querySelectorAll('.grid-stack-item').forEach(function(w) { w.style.outline = ''; });
    if (!q) return;
    var first = null;
    document.querySelectorAll('.grid-stack-item').forEach(function(w) {
      var titleEl = w.querySelector('.widget-title');
      var title = titleEl ? titleEl.textContent : '';
      var id = w.getAttribute('gs-id') || '';
      if (title.toLowerCase().includes(q) || id.toLowerCase().includes(q)) {
        w.style.outline = '2px solid var(--accent)';
        w.style.outlineOffset = '-2px';
        if (!first) first = w;
      }
    });
    if (first) first.scrollIntoView({behavior:'smooth',block:'center'});
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { this.value = ''; this.dispatchEvent(new Event('input')); this.blur(); }
  });
})();

waitForGridStack();
