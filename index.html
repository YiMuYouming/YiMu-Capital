<script>
'use strict';

// === GridStack Init ===
var grid = null;
var activePreset = null;
var activeLayoutId = null;
var _suppressLayoutSave = false;
var FIRST_SCREEN_WIDGETS = ['W25','W15','W24','W14','W04','W22'];
var SECONDARY_EVIDENCE_WIDGETS = ['W08','W09','W10','W12','W13','W21','W06'];
var REQUIRED_LAYOUT_WIDGETS = ['W25', 'W15', 'W24'];
var CORE_IDS = FIRST_SCREEN_WIDGETS.slice();
var EVIDENCE_SHELF_WIDGETS = SECONDARY_EVIDENCE_WIDGETS;
var COCKPIT_LAYOUT_VERSION = '3.0-density-20260620-4';
var COCKPIT_LAYOUT = [
  { id:'W25', x:0, y:0, w:6, h:9 },
  { id:'W15', x:6, y:0, w:3, h:5 },
  { id:'W14', x:9, y:0, w:3, h:5 },
  { id:'W24', x:6, y:5, w:6, h:4 },
  { id:'W04', x:0, y:9, w:4, h:5 },
  { id:'W22', x:4, y:9, w:8, h:5 }
];

function initGrid() {
  grid = GridStack.init({
    column: 12,
    cellHeight: 60,
    margin: 6,
    float: true,
    animate: false,
    handle: '.widget-header',
    removable: true,
    removeTimeout: 100,
    acceptWidgets: true,
    dragIn: '.newWidget',
    dragInOptions: { revert: 'invalid', scroll: false, appendTo: 'body', helper: 'clone' },
    columnOpts: { breakpoints: [{ w: 768, c: 1 }], layout: 'list' },
    minRow: 1,
    maxRow: 100,
  });

  // 事件监听
  grid.on('dragstart', function() { isDragging = true; });
  grid.on('dragstop', function() { isDragging = false; DataStore.notifyAll(); });
  grid.on('resizestop', function(e, el) { _onWidgetResize(el); });
  grid.on('change', function() { _autoSaveLayout(); });

  // 从命名布局恢复；没有用户布局时回退到内置驾驶舱模板
  _loadActiveNamedLayoutOrFallback();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('topbar').style.display = '';
  document.body.classList.add('ready');
  _updateRuntimeModeLabel();
}

// === Widget 实例管理 ===
var widgetInstances = {};

function _addWidgetToGrid(widgetId) {
  // W16 报数面板：浮窗模式，不加入 GridStack
  if (widgetId === 'W16') { _showInputPanel(); return; }

  // 去重：已有同 ID 组件则聚焦并提示
  if (widgetInstances[widgetId]) {
    var exist = document.querySelector('[gs-id="' + widgetId + '"]');
    if (exist) exist.scrollIntoView({ behavior: 'smooth' });
    showToast((WidgetRegistry.getMeta(widgetId)||{}).title + ' 已在画布中');
    return;
  }

  var meta = WidgetRegistry.getMeta(widgetId);
  if (!meta) return;

  var entry = WidgetRegistry.get(widgetId);
  if (!entry || !entry.Class) {
    console.warn('Widget ' + widgetId + ' not registered yet. Loading placeholder.');
    _addPlaceholderWidget(widgetId, meta);
    return;
  }

  var instance = new entry.Class({
    id: meta.id,
    type: meta.type,
    title: meta.title,
    category: meta.category,
    tier: meta.tier,
    dataPaths: meta.dataPaths,
    defaultSize: meta.defaultSize,
  });

  // GridStack v12 标准：addWidget 返回 HTMLElement，直接取 grid-stack-item-content 挂载
  var addConfig = { w: meta.defaultSize.w, h: meta.defaultSize.h, id: widgetId };
  if (widgetId === 'W25') {
    addConfig.x = 0;
    addConfig.y = 0;
  }
  var gsItem = grid.addWidget(addConfig);
  var contentEl = gsItem.querySelector('.grid-stack-item-content');
  if (contentEl) contentEl.id = 'content_' + widgetId;
  widgetInstances[widgetId] = instance;
  if (contentEl) instance.mount(contentEl);
}

function _ensureRequiredLayoutWidgets() {
  REQUIRED_LAYOUT_WIDGETS.forEach(function(widgetId) {
    if (!widgetInstances[widgetId]) _addWidgetToGrid(widgetId);
  });
}

function _clearGridWidgets() {
  Object.keys(widgetInstances).forEach(function(id) {
    var inst = widgetInstances[id];
    if (inst && typeof inst.unmount === 'function') inst.unmount();
  });
  widgetInstances = {};
  if (!grid) return;
  Array.prototype.slice.call(document.querySelectorAll('.grid-stack-item')).forEach(function(el) {
    grid.removeWidget(el, true, false);
  });
}

function _mountLayoutWidget(item) {
  var id = item.id;
  var meta = WidgetRegistry.getMeta(id);
  if (!meta || widgetInstances[id]) return;
  var entry = WidgetRegistry.get(id);
  var gsItem = grid.addWidget({
    x: item.x || 0,
    y: item.y || 0,
    w: item.w || meta.defaultSize.w,
    h: item.h || meta.defaultSize.h,
    id: id
  });
  if (WidgetRegistry.isFirstScreen && WidgetRegistry.isFirstScreen(id)) gsItem.classList.add('core-widget');
  var contentEl = gsItem.querySelector('.grid-stack-item-content');
  if (contentEl) contentEl.id = 'content_' + id;
  if (entry && entry.Class) {
    var instance = new entry.Class({
      id: meta.id, type: meta.type, title: meta.title,
      category: meta.category, tier: meta.tier,
      dataPaths: meta.dataPaths, defaultSize: meta.defaultSize,
    });
    widgetInstances[id] = instance;
    instance.mount(contentEl);
  } else {
    var headerCls = meta.category==='decision'?'color-decision':meta.category==='data'?'color-data':meta.category==='risk'?'color-risk':'color-tool';
    if (contentEl) {
      contentEl.id = 'content_' + id;
      contentEl.innerHTML = '<div class="widget-header ' + headerCls + '" style="cursor:default"><span class="widget-title">' + meta.title + '</span></div>' +
        '<div class="widget-body" style="display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">组件加载中...</div>';
    }
  }
}

function _readNamedLayouts() {
  try {
    var raw = localStorage.getItem(STORAGE_KEYS.namedLayouts);
    var parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch(e) {
    return {};
  }
}

function _writeNamedLayouts(layouts) {
  try { localStorage.setItem(STORAGE_KEYS.namedLayouts, JSON.stringify(layouts || {})); } catch(e) {}
}

function _newLayoutId() {
  return 'layout_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
}

var _layoutDialogSubmit = null;

function _normalizeLayoutName(name) {
  name = String(name).trim();
  return name ? name.slice(0, 24) : '';
}

function _closeLayoutDialog() {
  var overlay = document.getElementById('layoutDialogOverlay');
  if (overlay) overlay.classList.remove('show');
  var confirmBtn = document.getElementById('layoutDialogConfirm');
  confirmBtn.classList.remove('danger');
  confirmBtn.textContent = '确定';
  _layoutDialogSubmit = null;
}

function _openLayoutDialog(options) {
  options = options || {};
  var overlay = document.getElementById('layoutDialogOverlay');
  var title = document.getElementById('layoutDialogTitle');
  var message = document.getElementById('layoutDialogMessage');
  var input = document.getElementById('layoutDialogInput');
  if (!overlay || !title || !message || !input) return;
  title.textContent = options.title || '布局';
  message.textContent = options.message || '';
  input.value = options.value || '';
  input.style.display = options.input === false ? 'none' : '';
  document.getElementById('layoutDialogConfirm').textContent = options.confirmText || '确定';
  document.getElementById('layoutDialogConfirm').classList.toggle('danger', options.danger === true);
  _layoutDialogSubmit = function() {
    if (options.input === false) {
      _closeLayoutDialog();
      if (typeof options.onConfirm === 'function') options.onConfirm();
      return;
    }
    var name = _normalizeLayoutName(input.value);
    if (!name) { showToast('布局名称不能为空'); input.focus(); return; }
    _closeLayoutDialog();
    if (typeof options.onConfirm === 'function') options.onConfirm(name);
  };
  overlay.classList.add('show');
  setTimeout(function() {
    if (options.input !== false) {
      input.focus();
      input.select();
    } else {
      document.getElementById('layoutDialogConfirm').focus();
    }
  }, 0);
}

function _uniqueLayoutName(layouts, name, exceptId) {
  var base = (name || '未命名布局').slice(0, 24);
  var candidate = base;
  var n = 2;
  var exists = function(value) {
    return Object.keys(layouts || {}).some(function(id) {
      return id !== exceptId && (layouts[id] || {}).name === value;
    });
  };
  while (exists(candidate)) {
    candidate = (base.slice(0, 20) + '-' + n).slice(0, 24);
    n += 1;
  }
  return candidate;
}

function _captureCurrentLayout() {
  if (!grid) return [];
  return (grid.save(false) || []).filter(function(item) {
    return item && item.id && WidgetRegistry.getMeta(item.id);
  }).map(function(item) {
    return {
      id: item.id,
      x: item.x || 0,
      y: item.y || 0,
      w: item.w || 1,
      h: item.h || 1
    };
  });
}

function _setCurrentLayoutId(id) {
  activeLayoutId = id || null;
  try {
    if (activeLayoutId) localStorage.setItem(STORAGE_KEYS.activeLayoutId, activeLayoutId);
    else localStorage.removeItem(STORAGE_KEYS.activeLayoutId);
  } catch(e) {}
  _refreshLayoutViewSelector();
}

function _sortedLayoutIds(layouts) {
  return Object.keys(layouts || {}).sort(function(a, b) {
    var la = layouts[a] || {};
    var lb = layouts[b] || {};
    var ta = la.updatedAt || la.createdAt || '';
    var tb = lb.updatedAt || lb.createdAt || '';
    if (ta !== tb) return ta < tb ? 1 : -1;
    return (la.name || a).localeCompare(lb.name || b, 'zh-CN');
  });
}

function _refreshLayoutViewSelector() {
  var select = document.getElementById('layoutViewSelect');
  if (!select) return;
  var layouts = _readNamedLayouts();
  var defaultId = '';
  try { defaultId = localStorage.getItem(STORAGE_KEYS.defaultLayoutId) || ''; } catch(e) {}
  var ids = _sortedLayoutIds(layouts);
  select.innerHTML = '';
  var base = document.createElement('option');
  base.value = '';
  base.textContent = activeLayoutId ? '选择布局' : '内置/未保存';
  select.appendChild(base);
  ids.forEach(function(id) {
    var layout = layouts[id];
    if (!layout) return;
    var opt = document.createElement('option');
    opt.value = id;
    opt.textContent = (layout.name || id) + (id === defaultId ? ' · 默认' : '');
    select.appendChild(opt);
  });
  select.value = activeLayoutId && layouts[activeLayoutId] ? activeLayoutId : '';
}

function _loadLayoutItems(items, options) {
  options = options || {};
  _closeTransientSurfaces();
  _suppressLayoutSave = true;
  try {
    _clearGridWidgets();
    (items || []).forEach(_mountLayoutWidget);
  } finally {
    _suppressLayoutSave = false;
  }
  document.body.classList.toggle('cockpit-mode', options.cockpit === true);
  try { DataStore.notifyAll(); } catch(e) {}
}

function _loadNamedLayout(id, options) {
  options = options || {};
  var layouts = _readNamedLayouts();
  var layout = layouts[id];
  if (!layout || !Array.isArray(layout.items)) return false;
  _loadLayoutItems(layout.items, { cockpit: layout.kind === 'cockpit' });
  _setCurrentLayoutId(id);
  if (options.toast !== false) showToast('已切换布局：' + (layout.name || id));
  return true;
}

function _migrateLegacySavedLayoutToNamedView() {
  var layouts = _readNamedLayouts();
  if (_sortedLayoutIds(layouts).length) return null;
  try {
    var saved = localStorage.getItem(STORAGE_KEYS.layout);
    if (!saved) return null;
    var data = JSON.parse(saved);
    var items = data && data.v === '2.1' && Array.isArray(data.items) ? data.items : null;
    if (!items || !items.length) return null;
    var now = new Date().toISOString();
    var id = 'layout_legacy';
    layouts[id] = {
      id: id,
      name: localStorage.getItem(STORAGE_KEYS.layoutMode) === 'cockpit' ? '驾驶舱' : '旧布局',
      kind: 'user',
      createdAt: now,
      updatedAt: now,
      items: items
    };
    _writeNamedLayouts(layouts);
    localStorage.setItem(STORAGE_KEYS.activeLayoutId, id);
    if (!localStorage.getItem(STORAGE_KEYS.defaultLayoutId)) localStorage.setItem(STORAGE_KEYS.defaultLayoutId, id);
    return id;
  } catch(e) {
    return null;
  }
}

function _loadActiveNamedLayoutOrFallback() {
  var activeId = '';
  var defaultId = '';
  try {
    activeId = localStorage.getItem(STORAGE_KEYS.activeLayoutId) || '';
    defaultId = localStorage.getItem(STORAGE_KEYS.defaultLayoutId) || '';
  } catch(e) {}
  var preferredId = activeId || defaultId;
  if (preferredId && _loadNamedLayout(preferredId, { toast:false })) return;
  if (defaultId && defaultId !== preferredId && _loadNamedLayout(defaultId, { toast:false })) return;
  var legacyId = _migrateLegacySavedLayoutToNamedView();
  if (legacyId && _loadNamedLayout(legacyId, { toast:false })) {
    showToast('已迁移旧布局为命名视图');
    return;
  }
  applyCockpitLayout({ persist:false, toast:false });
  showToast('已加载内置驾驶舱');
}

function _createBlankLayoutView() {
  _loadLayoutItems([], { cockpit:false });
  _setCurrentLayoutId(null);
  showToast('已新建空白画布');
}

function _saveCurrentLayoutView() {
  var layouts = _readNamedLayouts();
  var id = activeLayoutId;
  if (!id || !layouts[id]) {
    _saveCurrentLayoutAs();
    return;
  }
  layouts[id].items = _captureCurrentLayout();
  layouts[id].updatedAt = new Date().toISOString();
  layouts[id].kind = layouts[id].kind || 'user';
  _writeNamedLayouts(layouts);
  _refreshLayoutViewSelector();
  showToast('已保存布局：' + (layouts[id].name || id));
}

function _saveCurrentLayoutAs() {
  _openLayoutDialog({
    title: '保存当前布局',
    message: '给这屏布局命名，后续可在“布局”下拉框中切换。',
    value: '',
    onConfirm: function(name) {
      var layouts = _readNamedLayouts();
      name = _uniqueLayoutName(layouts, name);
      var id = _newLayoutId();
      var now = new Date().toISOString();
      layouts[id] = {
        id: id,
        name: name,
        kind: 'user',
        createdAt: now,
        updatedAt: now,
        items: _captureCurrentLayout()
      };
      _writeNamedLayouts(layouts);
      _setCurrentLayoutId(id);
      try {
        if (!localStorage.getItem(STORAGE_KEYS.defaultLayoutId)) localStorage.setItem(STORAGE_KEYS.defaultLayoutId, id);
      } catch(e) {}
      _refreshLayoutViewSelector();
      showToast('已保存布局：' + name);
    }
  });
}

function _renameCurrentLayoutView() {
  var layouts = _readNamedLayouts();
  var id = activeLayoutId;
  if (!id || !layouts[id]) { showToast('当前是未保存布局'); return; }
  _openLayoutDialog({
    title: '重命名布局',
    message: '只修改名称，不改变当前组件位置。',
    value: layouts[id].name || '',
    onConfirm: function(name) {
      name = _uniqueLayoutName(layouts, name, id);
      layouts[id].name = name;
      layouts[id].updatedAt = new Date().toISOString();
      _writeNamedLayouts(layouts);
      _refreshLayoutViewSelector();
      showToast('已重命名为：' + name);
    }
  });
}

function _deleteCurrentLayoutView() {
  var layouts = _readNamedLayouts();
  var id = activeLayoutId;
  if (!id || !layouts[id]) { showToast('当前布局尚未保存'); return; }
  var name = layouts[id].name || id;
  _openLayoutDialog({
    title: '删除布局',
    message: '删除布局“' + name + '”？这个操作不会删除组件本身，只删除这套摆放方案。',
    input: false,
    danger: true,
    confirmText: '确认删除',
    onConfirm: function() {
      delete layouts[id];
      _writeNamedLayouts(layouts);
      var nextIds = _sortedLayoutIds(layouts);
      var nextDefaultId = '';
      try {
        if (localStorage.getItem(STORAGE_KEYS.defaultLayoutId) === id) {
          if (nextIds[0]) localStorage.setItem(STORAGE_KEYS.defaultLayoutId, nextIds[0]);
          else localStorage.removeItem(STORAGE_KEYS.defaultLayoutId);
        }
        nextDefaultId = localStorage.getItem(STORAGE_KEYS.defaultLayoutId) || '';
      } catch(e) {}
      if (nextDefaultId && layouts[nextDefaultId]) {
        _loadNamedLayout(nextDefaultId, { toast:false });
        showToast('已删除布局：' + name);
      } else if (nextIds[0]) {
        _loadNamedLayout(nextIds[0], { toast:false });
        showToast('已删除布局：' + name);
      } else {
        _setCurrentLayoutId(null);
        applyCockpitLayout({ persist:false, toast:false });
        showToast('已删除布局：' + name);
      }
    }
  });
}

function _setCurrentLayoutDefault() {
  var layouts = _readNamedLayouts();
  var id = activeLayoutId;
  if (!id || !layouts[id]) { showToast('请先保存当前布局'); return; }
  try { localStorage.setItem(STORAGE_KEYS.defaultLayoutId, id); } catch(e) {}
  _refreshLayoutViewSelector();
  showToast('已设为默认：' + (layouts[id].name || id));
}

function applyCockpitLayout(options) {
  options = options || {};
  _loadLayoutItems(COCKPIT_LAYOUT, { cockpit:true });
  _setCurrentLayoutId(null);
  if (options.persist !== false) {
    try { localStorage.setItem(STORAGE_KEYS.layoutMode, 'cockpit'); } catch(e) {}
    try { localStorage.setItem(STORAGE_KEYS.cockpitLayoutVersion, COCKPIT_LAYOUT_VERSION); } catch(e) {}
  }
  if (options.toast !== false) showToast('已切换盘中驾驶舱：态势 + 持仓 + 风控 + 票据');
}

function _addPlaceholderWidget(widgetId, meta) {
  var headerCls = meta.category==='decision'?'color-decision':meta.category==='data'?'color-data':meta.category==='risk'?'color-risk':'color-tool';
  grid.addWidget({
    w: meta.defaultSize.w, h: meta.defaultSize.h, id: widgetId,
    content: '<div id="content_' + widgetId + '">' +
      '<div class="widget-header ' + headerCls + '" style="cursor:default"><span class="widget-title">' + meta.title + '</span></div>' +
      '<div class="widget-body" style="display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">组件加载中...</div></div>'
  });
}

function _removeWidget(widgetId) {
  var instance = widgetInstances[widgetId];
  if (instance) { instance.unmount(); delete widgetInstances[widgetId]; }
  var el = document.querySelector('[gs-id="' + widgetId + '"]');
  if (el) {
    grid.removeWidget(el, true, false);
    // 5 秒撤销 toast
    var removedMeta = WidgetRegistry.getMeta(widgetId);
    showToast('已删除 ' + (removedMeta?removedMeta.title:widgetId) + '（5秒内可撤销）');
    window._undoRemove = { widgetId: widgetId, meta: removedMeta, timer: setTimeout(function() { window._undoRemove = null; }, 5000) };
  }
}

function _undoRemoveWidget() {
  if (!window._undoRemove) return;
  var item = window._undoRemove;
  clearTimeout(item.timer);
  window._undoRemove = null;
  _addWidgetToGrid(item.widgetId);
  showToast('已恢复 ' + item.meta.title);
}
// 暴露给 widget-base.js
window._removeWidget = _removeWidget;

function _onWidgetResize(el) {
  var id = el.getAttribute('gs-id');
  var instance = widgetInstances[id];
  if (instance && el.gridstackNode) {
    instance.resize(el.gridstackNode.w, el.gridstackNode.h);
  }
}

function _closeTopbarMenus() {
  document.querySelectorAll('.topbar-action-menu,.topbar-layout-menu').forEach(function(menu) {
    menu.open = false;
  });
}

function _closeTransientSurfaces() {
  _closeTopbarMenus();
  _closeLayoutDialog();
  var contextMenu = document.getElementById('contextMenu');
  if (contextMenu) contextMenu.classList.remove('show');
  ['widgetPanelOverlay', 'inputPanelOverlay', 'llmPanelOverlay', 'evidenceShelfOverlay'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove('show');
  });
  _clearEvidenceShelf();
}

// === Context Menu ===
function _showContextMenu(x, y) {
  var menu = document.getElementById('contextMenu');
  var cats = WidgetRegistry.listByCategory();
  var catLabels = { decision: '决策类', data: '数据类', risk: '风控类', tool: '工具类' };
  var usageRoleLabels = { first_screen: '首屏', secondary_evidence: '侧屏', review_low: '复盘', hidden_eval: '隐藏' };

  var html = '';
  ['decision', 'risk', 'data', 'tool'].forEach(function(cat) {
    html += '<div class="context-menu-section">' + catLabels[cat] + '</div>';
    (cats[cat] || []).forEach(function(w) {
      html += '<div class="context-menu-item" data-widget="' + w.id + '" data-category="' + w.category + '" data-usage-role="' + (w.usageRole || '') + '">' +
        '<span>' + w.title + '</span><b>' + (usageRoleLabels[w.usageRole] || w.usageLabel || w.usageRole || '未分') + ' · ' + w.id + '</b></div>';
    });
  });

  menu.innerHTML = html;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('show');
  var rect = menu.getBoundingClientRect();
  var safeLeft = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8));
  var safeTop = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8));
  menu.style.left = safeLeft + 'px';
  menu.style.top = safeTop + 'px';

  menu.querySelectorAll('.context-menu-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var wid = item.dataset.widget;
      _addWidgetToGrid(wid);
      menu.classList.remove('show');
    });
  });
}

document.addEventListener('click', function(e) {
  var menu = document.getElementById('contextMenu');
  if (!menu.contains(e.target)) menu.classList.remove('show');
  if (!e.target.closest('.topbar-action-menu,.topbar-layout-menu')) _closeTopbarMenus();
});

document.getElementById('widgetPanelOverlay').addEventListener('click', function(e) {

document.getElementById('widgetPanelClose').addEventListener('click', function() {

var evidenceShelfInstances = {};

function _clearEvidenceShelf() {
  Object.keys(evidenceShelfInstances).forEach(function(id) {
    var inst = evidenceShelfInstances[id];
    if (inst && typeof inst.unmount === 'function') inst.unmount();
  });
  evidenceShelfInstances = {};

function _renderEvidenceShelfNav() {

  var iwc = data.iwencai || {};

function _detectRuntimeMode() {
  if (location.protocol === 'file:') return { key: 'file', label: '本地文件 · API不可用', readonly: true };
  if (/^180(8[0-9]|9[0-9])$/.test(location.port || '')) return { key: 'preview', label: '本地预览 · 只读', readonly: true };
  if (location.port === '8088') return { key: 'prod', label: '云端生产', readonly: false };
  return { key: 'local', label: '本地服务', readonly: false };
}
function _renderFileModeNotice() {
  var notice = document.getElementById('fileModeNotice');
  var isFile = location.protocol === 'file:';
  if (notice) notice.style.display = isFile ? 'block' : 'none';
  document.body.classList.toggle('file-mode', isFile);
}
function _updateRuntimeModeLabel() {
  var el = document.getElementById('runtimeModeLabel');
  if (!el) return;
  var mode = _detectRuntimeMode();
  var colors = { prod: '#16a34a', preview: '#ea580c', file: '#64748b', local: '#6366f1' };
  el.textContent = mode.label;
  el.style.color = colors[mode.key] || '#64748b';
  el.title = mode.key === 'file' ? '本地文件模式无法读取 /api，请使用 18088 或 8088' : (mode.readonly ? '只读模式，不录真实交易' : '生产模式，所有操作写入云端');
  _renderFileModeNotice();
}

    .catch(function() { return {}; })

      var todayItems = insights[today] || {};
      var nodes = ['竞价','早盘','午盘','尾盘','收盘'];

function _autoSaveLayout() {

  try {
    var layouts = _readNamedLayouts();
    var currentId = activeLayoutId || localStorage.getItem(STORAGE_KEYS.activeLayoutId);
    var layout = currentId ? layouts[currentId] : null;
    if (layout && layout.kind === 'user') {
      layout.items = _captureCurrentLayout();

      _writeNamedLayouts(layouts);

function exportLayout() {

  var blob = new Blob([json], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dashboard-layout-' + new Date().toISOString().slice(0,10) + '.json';

function importLayout(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      var items = data.widgets || data.items || data || [];
      _loadLayoutItems(items, { cockpit:false });
      _setCurrentLayoutId(null);
      showToast('布局已导入（未保存）');
    } catch(err) { showToast('导入失败：格式错误'); }
  };
  reader.readAsText(file);
}

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    Object.values(widgetInstances).forEach(function(inst) { inst.refresh(); });

  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); _saveCurrentLayoutView(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); _undoRemoveWidget(); }
  if (e.key === 'a' || e.key === 'A') {

window._healthCritical = true;
window._healthConfirmed = false;
(function() {
  var _healthWasOk = false;
  function _updateMetrics() {
    var m = DataStore.merged || {};
    var pnl = m.pnl_live || {};
    var sent = m.sentiment || {};

    var emo = document.getElementById('topbarEmotion');
    var emoVal = sent['情绪值'] != null ? sent['情绪值'] : null;
    if (emo) {
      emo.textContent = '情绪 ' + (emoVal != null ? Math.round(emoVal) + '%' : '—');
      emo.style.color = emoVal < 20 ? 'var(--danger)' : emoVal < 40 ? 'var(--warn)' : '';
    }

    var pnlEl = document.getElementById('topbarPnl');
    var pnlPct = parseFloat(pnl.pnl_pct);
    if (pnlEl) {
      if (!isNaN(pnlPct)) {
        var s = pnlPct >= 0 ? '+' : '';
        pnlEl.textContent = '盈亏 ' + s + pnlPct.toFixed(2) + '%';
        pnlEl.style.color = pnlPct >= 0 ? 'var(--up)' : 'var(--down)';
      } else { pnlEl.textContent = '盈亏 —'; pnlEl.style.color = ''; }
    }

    var posEl = document.getElementById('topbarPosPct');
    var mv = parseFloat(pnl.mv);
    var ta = parseFloat(pnl.total_asset);
    var posPct = (ta > 0) ? (mv / ta * 100) : null;
    if (posEl) {
      posEl.textContent = '仓位 ' + (posPct != null ? posPct.toFixed(1) + '%' : '—');
    }

    var cashEl = document.getElementById('topbarCash');
    var cash = parseFloat(pnl.cash);
    if (cashEl) {
      if (!isNaN(cash) && cash >= 0) {
        cashEl.textContent = '可用 ' + (cash / 10000).toFixed(1) + '万';
      } else { cashEl.textContent = '可用 —'; }
    }
  }

  function _updateHealth() {
    var hDot = document.getElementById('healthDot');
    var hLabel = document.getElementById('healthLabel');
    if (!hDot || !hLabel) return;
    if (location.protocol === 'file:') {
      hDot.className = 'health-dot dead';
      hLabel.textContent = '文件模式';
      hLabel.title = '本地文件模式无法读取 /api，请使用 http://localhost:18088/ 或 http://localhost:8088/';
      hLabel.style.color = 'var(--danger)';
      window._healthCritical = true;
      window._healthConfirmed = false;
      var fileBar = document.getElementById('topbar');
      if (fileBar) fileBar.style.boxShadow = 'inset 0 -2px 0 var(--danger)';
      return;
    }

    fetch('/api/health').then(function(r) {
      // HTTP non-2xx -> 无响应
      if (!r.ok) {
        hDot.className = 'health-dot dead'; hLabel.textContent = '无响应';
        hLabel.title = 'API 响应状态码 ' + r.status;
        hLabel.style.color = 'var(--danger)';
        window._healthCritical = true; window._healthConfirmed = false;
        var bar2 = document.getElementById('topbar');
        if (bar2) bar2.style.boxShadow = 'inset 0 -2px 0 var(--danger)';
        if (_healthWasOk) { _healthWasOk = false; DataStore.notifyAll(); }
        return;
      }
      return r.json().then(function(h) {
      if (!h) {
        hDot.className = 'health-dot dead'; hLabel.textContent = '无响应';
        hLabel.style.color = 'var(--danger)';
        window._healthCritical = true; window._healthConfirmed = false;
        var bar2 = document.getElementById('topbar');
        if (bar2) bar2.style.boxShadow = 'inset 0 -2px 0 var(--danger)';
        if (_healthWasOk) { _healthWasOk = false; DataStore.notifyAll(); }
        return;
      }
      var te = h.trade_entry_allowed;
      var degraded = (h.degraded_reasons || []).length > 0;
      window._quoteHealthStatus = h.quotes && h.quotes.status === 'close_snapshot' ? 'close_snapshot' : null;
      _renderConnectionStatus(DataStore.getConnectionStatus());
      // Final trade entry comes from DataStore decision_gate.v1. Health only
      // controls system-health rendering and must never grant an action.
      if (te === false) {
        hDot.className = 'health-dot dead'; hLabel.textContent = '阻断'; hLabel.style.color = 'var(--danger)';
        window._healthCritical = true; window._healthConfirmed = true;
      } else if (degraded) {
        hDot.className = 'health-dot delayed'; hLabel.textContent = '降级'; hLabel.style.color = 'var(--warn)';
        window._healthCritical = false; window._healthConfirmed = true;
      } else {
        hDot.className = 'health-dot live'; hLabel.textContent = '正常'; hLabel.style.color = '';
        window._healthCritical = false; window._healthConfirmed = true;
      }
      // Pulse bar on critical
      var bar = document.getElementById('topbar');
      if (bar) bar.style.boxShadow = window._healthCritical ? 'inset 0 -2px 0 var(--danger)' : '';
      // Health state change → refresh decision widgets immediately
      var prevOk = _healthWasOk;
      _healthWasOk = !window._healthCritical;
      if (!prevOk && _healthWasOk) {
        DataStore.notifyAll();
      }
      if (prevOk && !_healthWasOk) {
        // Health degraded → force re-render W08/W09 to hide entry buttons
        DataStore.notifyAll();
      }
      }); // close r.json().then(h_callback)
    }).catch(function() {
      hDot.className = 'health-dot dead'; hLabel.textContent = '无响应'; hLabel.style.color = 'var(--danger)';
      window._healthCritical = true;
      window._healthConfirmed = false;
      if (_healthWasOk) { _healthWasOk = false; DataStore.notifyAll(); }
    });
  }

  var _healthWasOk = false;
  DataStore.subscribe(['pnl_live', 'sentiment'], _updateMetrics);
  setInterval(_updateMetrics, 30000);
  setInterval(_updateHealth, 60000);
  setTimeout(_updateMetrics, 2000);
  setTimeout(_updateHealth, 3000);
})();

// === Compact Mode ===
var _compactMode = false;
(function() {
  var btn = document.getElementById('compactBtn');
  if (!btn) return;
  var origAdd = _addWidgetToGrid;
  _addWidgetToGrid = function(widgetId) {
    origAdd(widgetId);
    setTimeout(function() {
      var el = document.querySelector('[gs-id="' + widgetId + '"]');
      if (el && WidgetRegistry.isFirstScreen && WidgetRegistry.isFirstScreen(widgetId)) el.classList.add('core-widget');
    }, 100);
  };
  FIRST_SCREEN_WIDGETS.forEach(function(id) {
    var el = document.querySelector('[gs-id="' + id + '"]');
    if (el) el.classList.add('core-widget');
  });
  btn.addEventListener('click', function() {
    _compactMode = !_compactMode;
    btn.textContent = _compactMode ? '显示全部' : '只看核心';
    btn.title = _compactMode ? '恢复全部组件' : '隐藏非核心组件';
    btn.style.background = _compactMode ? 'var(--accent)' : '';
    btn.style.color = _compactMode ? '#fff' : '';
    document.body.classList.toggle('compact-mode', _compactMode);
  });
})();

// === W15 预填链路（打开 W15 表单，只预填不保存不写 API）===
function _prefillW15(name, code, windowLabel, evidence) {
  DataStore._prefill = {
    name: name, code: code, window: windowLabel,
    evidence: evidence || '', ts: Date.now()
  };
  DataStore.merge(); DataStore.notifyAll();
  if (!widgetInstances['W15']) _addWidgetToGrid('W15');
  var w15el = document.querySelector('[gs-id="W15"]');
  if (w15el) w15el.scrollIntoView({ behavior: 'smooth' });
  // Open W15 real form with prefill — read active positions from merged data
  var inst = widgetInstances['W15'];
  if (inst && typeof inst._showForm === 'function') {
    var m = DataStore.merged || {};
    var pos = m.pnl_live && m.pnl_live.positions ? m.pnl_live.positions : (m.positions || []);
    var active = pos.filter(function(p) {
      var s = p['状态'] || ''; return s.indexOf('清') < 0 && s.indexOf('删') < 0;
    });
    setTimeout(function() { inst._showForm(active); }, 100);
  }
  showToast('已预填 W15: ' + name + ' ' + code + ' ' + windowLabel);
}

// === Toast ===
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function() { t.className = 'toast'; }, 2500);
}

document.getElementById('layoutDialogOverlay').addEventListener('click', function(e) {
  if (e.target === this) _closeLayoutDialog();
});
document.getElementById('layoutDialogCancel').addEventListener('click', function() { _closeLayoutDialog(); });
document.getElementById('layoutDialogConfirm').addEventListener('click', function() {

});
document.getElementById('layoutDialogInput').addEventListener('keydown', function(e) {

document.getElementById('layoutViewSelect').addEventListener('change', function() {

});
document.getElementById('blankLayoutBtn').addEventListener('click', function() { _closeTopbarMenus(); _createBlankLayoutView(); });
document.getElementById('saveLayoutBtn').addEventListener('click', function() { _closeTopbarMenus(); _saveCurrentLayoutView(); });
document.getElementById('saveAsLayoutBtn').addEventListener('click', function() { _closeTopbarMenus(); _saveCurrentLayoutAs(); });
document.getElementById('renameLayoutBtn').addEventListener('click', function() { _closeTopbarMenus(); _renameCurrentLayoutView(); });
document.getElementById('deleteLayoutBtn').addEventListener('click', function() { _closeTopbarMenus(); _deleteCurrentLayoutView(); });
document.getElementById('defaultLayoutBtn').addEventListener('click', function() { _closeTopbarMenus(); _setCurrentLayoutDefault(); });
document.getElementById('builtInCockpitBtn').addEventListener('click', function() { _closeTopbarMenus(); applyCockpitLayout({ persist:true, toast:true }); });

document.getElementById('importLayoutBtn').addEventListener('click', function() {

});
document.getElementById('importFileInput').addEventListener('change', function() {

// === Init ===
// Wait for GridStack CDN
function waitForGridStack() {
  if (typeof GridStack !== 'undefined') {
    // 加载 manualData
    DataStore.manualData.load();
    // 立即用兜底数据初始化，避免白屏
    DataStore.init();
    // 初始化组件注册（widget 脚本已加载时自动注册见各 widget 文件末尾）
    initGrid();
    // AI 交互迁移到 Codex/终端；仪表盘默认不挂载聊天框，避免自动 POST。
    // 尝试拉取基线数据（file:// 协议下会失败，降级到兜底数据）
    DataStore.fetchAll();
    // v3.0 PyTDX 实时管线：每个 tick 组件自带 5s 定时器刷新
  } else {
    setTimeout(waitForGridStack, 100);
  }
}

// === 组件搜索定位 ===
(function() {
  var input = document.getElementById('widgetSearch');
  if (!input) return;

  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      var active = document.activeElement;
      if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) return;
      e.preventDefault();
      input.focus();
      input.select();
    }
  });

  input.addEventListener('input', function() {
    var q = this.value.trim().toLowerCase();
    document.querySelectorAll('.grid-stack-item').forEach(function(w) { w.style.outline = ''; });
    if (!q) return;
    var first = null;
    document.querySelectorAll('.grid-stack-item').forEach(function(w) {
      var titleEl = w.querySelector('.widget-title');
      var title = titleEl ? titleEl.textContent : '';
      var id = w.getAttribute('gs-id') || '';
      if (title.toLowerCase().includes(q) || id.toLowerCase().includes(q)) {
        w.style.outline = '2px solid var(--accent)';
        w.style.outlineOffset = '-2px';
        if (!first) first = w;
      }
    });
    if (first) first.scrollIntoView({behavior:'smooth',block:'center'});
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { this.value = ''; this.dispatchEvent(new Event('input')); this.blur(); }
  });
})();

waitForGridStack();
</script>
