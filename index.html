<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弈沐资本 · 数据看板 v2.0</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<!-- GridStack.js v12.x CDN (版本锁定) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@12.0.0/dist/gridstack.min.css">
<!-- 内部样式 -->
<link rel="stylesheet" href="css/theme.css">
<!-- 兜底数据 -->
<script src="data/embedded-data.js"></script>
<!-- 核心模块 -->
<script src="store.js"></script>
<script src="widget-base.js"></script>
<script src="widget-registry.js"></script>
<!-- 16 Widget 组件 -->
<script src="widgets/timeline.js"></script>
<script src="widgets/style-detect.js"></script>
<script src="widgets/position-calc.js"></script>
<script src="widgets/market-overview.js"></script>
<script src="widgets/sentiment-dash.js"></script>
<script src="widgets/auction-5d.js"></script>
<script src="widgets/climax-guard.js"></script>
<script src="widgets/w1-check.js"></script>
<script src="widgets/w2-check.js"></script>
<script src="widgets/sector-heat.js"></script>
<script src="widgets/volume-bars.js"></script>
<script src="widgets/lianban-pool.js"></script>
<script src="widgets/trend-pool.js"></script>
<script src="widgets/risk-panel.js"></script>
<script src="widgets/positions.js"></script>
<script src="widgets/input-panel.js"></script>
<script src="widgets/today-ops.js"></script>
<script src="widgets/anchor-stocks.js"></script>
<style>
/* Inline critical styles for initial load */
body{opacity:0;transition:opacity .3s}
body.ready{opacity:1}
#loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--text-secondary);font-family:var(--font-sans);font-size:var(--fs-body);z-index:9999}
/* Widget Panel */
.widget-panel-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:2000;align-items:center;justify-content:center}
.widget-panel-overlay.show{display:flex}
.widget-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);width:90%;max-width:640px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column}
.widget-panel-header{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-md) var(--sp-lg);border-bottom:1px solid var(--border-light)}
.widget-panel-body{overflow-y:auto;padding:var(--sp-md) var(--sp-lg)}
.widget-panel-section{margin-bottom:var(--sp-md)}
.widget-panel-section-title{font-size:var(--fs-label);text-transform:uppercase;letter-spacing:var(--ls-label);color:var(--text-disabled);margin-bottom:var(--sp-sm);padding-bottom:var(--sp-xs);border-bottom:1px solid var(--border-light)}
.widget-panel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--sp-sm)}
.widget-panel-item{padding:var(--sp-sm) var(--sp-md);background:var(--bg-base);border:1px solid var(--border-light);border-radius:var(--radius-md);cursor:pointer;transition:background .15s,border-color .15s;font-size:var(--fs-body)}
.widget-panel-item:hover{background:var(--bg-hover);border-color:var(--info)}
.widget-panel-item .item-title{font-weight:600;color:var(--text-primary)}
.widget-panel-item .item-desc{font-size:var(--fs-label);color:var(--text-secondary);margin-top:2px}
</style>
</head>
<body>
<div id="loading">正在加载布局引擎...</div>

<!-- Top Bar -->
<header class="topbar" id="topbar" style="display:none">
  <span class="topbar-brand">弈沐资本 · 数据看板 v2.0</span>
  <span class="conn-dot polling" id="connDot"></span>
  <span class="conn-text" id="connText">轮询</span>
  <button id="addWidgetBtn" title="添加组件" style="background:var(--info);color:#fff;font-weight:600;border:none;padding:var(--sp-xs) var(--sp-md);border-radius:var(--radius-sm);cursor:pointer;font-size:var(--fs-body);font-family:var(--font-sans);white-space:nowrap;height:28px;line-height:1">+ 添加组件</button>
  <span style="flex:1"></span>
  <button class="widget-btn" id="saveLayoutBtn" title="保存布局 (Ctrl+S)">保存</button>
  <button class="widget-btn" id="exportLayoutBtn" title="导出布局 JSON">导出</button>
  <button class="widget-btn" id="importLayoutBtn" title="导入布局 JSON">导入</button>
  <input type="file" id="importFileInput" accept=".json" style="display:none">
</header>

<!-- GridStack Container -->
<div class="grid-stack" id="grid"></div>

<!-- Context Menu -->
<div class="context-menu" id="contextMenu"></div>

<!-- Widget Panel -->
<div class="widget-panel-overlay" id="widgetPanelOverlay">
  <div class="widget-panel" id="widgetPanel">
    <div class="widget-panel-header">
      <span style="font-size:var(--fs-subtitle);font-weight:600">添加组件</span>
      <button class="widget-btn" id="widgetPanelClose" style="font-size:18px">×</button>
    </div>
    <div class="widget-panel-body" id="widgetPanelBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/gridstack@12.0.0/dist/gridstack-all.min.js"></script>
<script>
'use strict';

// === GridStack Init ===
var grid = null;
var activePreset = null;

function initGrid() {
  grid = GridStack.init({
    column: 12,
    cellHeight: 60,
    margin: 6,
    float: true,
    animate: false,
    handle: '.widget-header',
    removable: true,
    removeTimeout: 100,
    acceptWidgets: true,
    dragIn: '.newWidget',
    dragInOptions: { revert: 'invalid', scroll: false, appendTo: 'body', helper: 'clone' },
    disableOneColumnMode: true,
    minRow: 1,
    maxRow: 100,
  });

  // 事件监听
  grid.on('dragstart', function() { isDragging = true; });
  grid.on('dragstop', function() { isDragging = false; DataStore.notifyAll(); });
  grid.on('resizestop', function(e, el) { _onWidgetResize(el); });
  grid.on('change', function() { _autoSaveLayout(); });

  // 从 localStorage 恢复布局
  _loadSavedLayout();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('topbar').style.display = '';
  document.body.classList.add('ready');
}

// === Widget 实例管理 ===
var widgetInstances = {};

function _addWidgetToGrid(widgetId) {
  // 去重：已有同 ID 组件则聚焦并提示
  if (widgetInstances[widgetId]) {
    var exist = document.querySelector('[gs-id="' + widgetId + '"]');
    if (exist) exist.scrollIntoView({ behavior: 'smooth' });
    showToast((WidgetRegistry.getMeta(widgetId)||{}).title + ' 已在画布中');
    return;
  }

  var meta = WidgetRegistry.getMeta(widgetId);
  if (!meta) return;

  var entry = WidgetRegistry.get(widgetId);
  if (!entry || !entry.Class) {
    console.warn('Widget ' + widgetId + ' not registered yet. Loading placeholder.');
    _addPlaceholderWidget(widgetId, meta);
    return;
  }

  var instance = new entry.Class({
    id: meta.id,
    type: meta.type,
    title: meta.title,
    category: meta.category,
    tier: meta.tier,
    dataPaths: meta.dataPaths,
    defaultSize: meta.defaultSize,
  });

  // GridStack v12: 先创建 DOM 元素再 addWidget
  var el = document.createElement('div');
  el.className = 'grid-stack-item';
  el.setAttribute('gs-id', widgetId);
  el.setAttribute('gs-w', meta.defaultSize.w);
  el.setAttribute('gs-h', meta.defaultSize.h);
  el.innerHTML = '<div class="grid-stack-item-content" id="content_' + widgetId + '"></div>';
  grid.addWidget(el);
  widgetInstances[widgetId] = instance;
  requestAnimationFrame(function() {
    var contentEl = document.getElementById('content_' + widgetId);
    if (contentEl) {
      instance.mount(contentEl);
    }
  });
}

function _addPlaceholderWidget(widgetId, meta) {
  var el = document.createElement('div');
  el.className = 'grid-stack-item';
  el.setAttribute('gs-id', widgetId);
  el.setAttribute('gs-w', meta.defaultSize.w);
  el.setAttribute('gs-h', meta.defaultSize.h);
  el.innerHTML = '<div class="grid-stack-item-content" id="content_' + widgetId + '">' +
    '<div class="widget-header ' + (meta.category==='decision'?'color-decision':meta.category==='data'?'color-data':meta.category==='risk'?'color-risk':'color-tool') + '">' +
    '<span class="widget-title">' + meta.title + '</span></div>' +
    '<div class="widget-body" style="display:flex;align-items:center;justify-content:center;color:var(--text-secondary)">组件加载中...</div></div>';
  grid.makeWidget(el);
}

function _removeWidget(widgetId) {
  var instance = widgetInstances[widgetId];
  if (instance) { instance.unmount(); delete widgetInstances[widgetId]; }
  var el = document.querySelector('[gs-id="' + widgetId + '"]');
  if (el) {
    grid.removeWidget(el, true, false);
    // 5 秒撤销 toast
    var removedMeta = WidgetRegistry.getMeta(widgetId);
    showToast('已删除 ' + (removedMeta?removedMeta.title:widgetId) + '（5秒内可撤销）');
    window._undoRemove = { widgetId: widgetId, meta: removedMeta, timer: setTimeout(function() { window._undoRemove = null; }, 5000) };
  }
}

function _undoRemoveWidget() {
  if (!window._undoRemove) return;
  var item = window._undoRemove;
  clearTimeout(item.timer);
  window._undoRemove = null;
  _addWidgetToGrid(item.widgetId);
  showToast('已恢复 ' + item.meta.title);
}
// 暴露给 widget-base.js
window._removeWidget = _removeWidget;

function _onWidgetResize(el) {
  var id = el.getAttribute('gs-id');
  var instance = widgetInstances[id];
  if (instance) {
    var w = parseInt(el.getAttribute('gs-w'));
    var h = parseInt(el.getAttribute('gs-h'));
    instance.resize(w, h);
  }
}

// === Context Menu ===
function _showContextMenu(x, y) {
  var menu = document.getElementById('contextMenu');
  var cats = WidgetRegistry.listByCategory();
  var catLabels = { decision: '决策类', data: '数据类', risk: '风控类', tool: '工具类' };

  var html = '';
  ['decision', 'risk', 'data', 'tool'].forEach(function(cat) {
    html += '<div class="context-menu-section">' + catLabels[cat] + '</div>';
    (cats[cat] || []).forEach(function(w) {
      html += '<div class="context-menu-item" data-widget="' + w.id + '">' + w.title + '</div>';
    });
  });

  menu.innerHTML = html;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('show');

  menu.querySelectorAll('.context-menu-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var wid = item.dataset.widget;
      _addWidgetToGrid(wid);
      menu.classList.remove('show');
    });
  });
}

document.addEventListener('click', function(e) {
  var menu = document.getElementById('contextMenu');
  if (!menu.contains(e.target)) menu.classList.remove('show');
});

// === Widget Panel (v2.1.1: 组件选择面板) ===
function _showWidgetPanel() {
  var overlay = document.getElementById('widgetPanelOverlay');
  var body = document.getElementById('widgetPanelBody');
  var cats = WidgetRegistry.listByCategory();
  var catLabels = { decision: '决策类', data: '数据类', risk: '风控类', tool: '工具类' };
  var catIcons = { decision: '🎯', data: '📊', risk: '💰', tool: '🔧' };

  var html = '';
  ['decision', 'risk', 'data', 'tool'].forEach(function(cat) {
    html += '<div class="widget-panel-section">';
    html += '<div class="widget-panel-section-title">' + (catIcons[cat]||'') + ' ' + catLabels[cat] + '</div>';
    html += '<div class="widget-panel-grid">';
    (cats[cat] || []).forEach(function(w) {
      html += '<div class="widget-panel-item" data-widget="' + w.id + '">' +
        '<div class="item-title">' + w.title + '</div>' +
        '<div class="item-desc">' + w.defaultSize.w + '×' + w.defaultSize.h + ' · ' + w.id + '</div>' +
        '</div>';
    });
    html += '</div></div>';
  });

  body.innerHTML = html;
  overlay.classList.add('show');

  // 点击添加
  body.querySelectorAll('.widget-panel-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var wid = item.dataset.widget;
      _addWidgetToGrid(wid);
      overlay.classList.remove('show');
      showToast('已添加: ' + (WidgetRegistry.getMeta(wid)||{}).title);
    });
  });
}

document.getElementById('widgetPanelOverlay').addEventListener('click', function(e) {
  if (e.target === this) this.classList.remove('show');
});
document.getElementById('widgetPanelClose').addEventListener('click', function() {
  document.getElementById('widgetPanelOverlay').classList.remove('show');
});

// 顶栏按钮
document.getElementById('addWidgetBtn').addEventListener('click', _showWidgetPanel);

// 右键画板空白处（保留右键菜单作为快捷方式）
document.addEventListener('contextmenu', function(e) {
  if (e.target.closest('.grid-stack-item-content')) return;
  e.preventDefault();
  _showContextMenu(e.clientX, e.clientY);
});

// === Presets (v2.0: 内联嵌入，避免 file:// CORS) ===
// === Layout Persistence ===
function _autoSaveLayout() {
  try {
    var layout = grid.save(false);
    localStorage.setItem(STORAGE_KEYS.layout, JSON.stringify({v:'2.1', items:layout}));
  } catch(e) {}
}
function _loadSavedLayout() {
  // v2.1: 只加载 v2.1 格式布局 {v:'2.1', items:[...]}
  try {
    var saved = localStorage.getItem(STORAGE_KEYS.layout);
    if (saved) {
      var data = JSON.parse(saved);
      if (data.v === '2.1' && Array.isArray(data.items) && data.items.length) {
        data.items.forEach(function(item) {
          var id = item.id;
          var meta = WidgetRegistry.getMeta(id);
          if (!meta) return;
          var entry = WidgetRegistry.get(id);
          var el = document.createElement('div');
          el.className = 'grid-stack-item';
          el.setAttribute('gs-id', id);
          el.setAttribute('gs-w', item.w || meta.defaultSize.w);
          el.setAttribute('gs-h', item.h || meta.defaultSize.h);
          el.setAttribute('gs-x', item.x || 0);
          el.setAttribute('gs-y', item.y || 0);
          el.innerHTML = '<div class="grid-stack-item-content" id="content_' + id + '"></div>';
          grid.addWidget(el);
          if (entry && entry.Class) {
            var instance = new entry.Class({
              id: meta.id, type: meta.type, title: meta.title,
              category: meta.category, tier: meta.tier,
              dataPaths: meta.dataPaths, defaultSize: meta.defaultSize,
            });
            widgetInstances[id] = instance;
            instance.mount(document.getElementById('content_' + id));
          }
        });
        return;
      }
    }
  } catch(e) {}
  // 旧格式或不兼容 → 清除，空白画布
  try { localStorage.removeItem(STORAGE_KEYS.layout); } catch(e) {}
  showToast('右键画布添加组件，拖拽摆放后 Ctrl+S 保存');
}
function exportLayout() {
  var layout = grid.save(false);
  var json = JSON.stringify({ version: '1.0', exported: new Date().toISOString(), widgets: layout }, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dashboard-layout-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('布局已导出');
}

function importLayout(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      (data.widgets || data || []).forEach(function(item) {
        var id = item.id; if (!id) return;
        if (!widgetInstances[id]) _addWidgetToGrid(id);
      });
      showToast('布局已导入');
    } catch(err) { showToast('导入失败：格式错误'); }
  };
  reader.readAsText(file);
}

// === Keyboard Shortcuts ===
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    Object.values(widgetInstances).forEach(function(inst) { inst.refresh(); });
    showToast('已刷新');
  }
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault();
    var w16 = document.getElementById('content_W16');
    if (w16) w16.scrollIntoView({ behavior: 'smooth' });
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); _autoSaveLayout(); showToast('已保存'); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); _undoRemoveWidget(); }
  if (e.key === 'a' || e.key === 'A') {
    e.preventDefault();
    var rect = document.body.getBoundingClientRect();
    _showContextMenu(rect.left + 100, rect.top + 100);
  }
});

// === Connection Status ===
DataStore.onConnChange(function(status) {
  var dot = document.getElementById('connDot');
  var txt = document.getElementById('connText');
  var isFile = location.protocol === 'file:';
  if (dot) dot.className = 'conn-dot ' + (isFile ? 'polling' : status);
  if (txt) txt.textContent = isFile ? '本地' : status === 'live' ? '实时' : status === 'polling' ? '轮询' : '断开';
});

// === Toast ===
function showToast(msg) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function() { t.className = 'toast'; }, 1800);
}

// === Event bindings ===// v2.1: preset select removed
document.getElementById('saveLayoutBtn').addEventListener('click', function() { _autoSaveLayout(); showToast('已保存'); });
document.getElementById('exportLayoutBtn').addEventListener('click', exportLayout);
document.getElementById('importLayoutBtn').addEventListener('click', function() {
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change', function() {
  if (this.files[0]) importLayout(this.files[0]);
});

// === Init ===
// Wait for GridStack CDN
function waitForGridStack() {
  if (typeof GridStack !== 'undefined') {
    // 加载 manualData
    DataStore.manualData.load();
    // 立即用兜底数据初始化，避免白屏
    DataStore.init();
    // 初始化组件注册（widget 脚本已加载时自动注册见各 widget 文件末尾）
    initGrid();
    // 尝试拉取实时数据（file:// 协议下会失败，降级到兜底数据）
    DataStore.fetchAll();
    // 每 5 分钟全量刷新
    setInterval(function() { DataStore.fetchAll(); }, 300000);
  } else {
    setTimeout(waitForGridStack, 100);
  }
}
waitForGridStack();
</script>
</body>
</html>
